[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peewee-decide"
dynamic = ["version"]
description = "Peewee: a small, fast reflex model that answers typed questions about a state in one forward pass"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "roadius2" }
]
keywords = ["decision-model", "rlcd", "calibration", "system-one", "routing", "guardrails", "agents", "tool-routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    # ModernBERT (the English and typed-decisions encoders) first shipped in transformers 4.48.0.
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
]
onnx = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "onnx-ir",
]
train = [
    "datasets>=2.14",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "fastapi>=0.110",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "onnx-ir",
]

[project.scripts]
peewee = "peewee_decide.__main__:main"

[project.urls]
Homepage = "https://github.com/roadius2/peewee"
Source = "https://github.com/roadius2/peewee"
Changelog = "https://github.com/roadius2/peewee/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["peewee_decide"]

[tool.setuptools.dynamic]
version = { attr = "peewee_decide.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
