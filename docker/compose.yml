# docker compose -f docker/compose.yml up
services:
  peewee:
    build:
      context: ..
      dockerfile: docker/Dockerfile          # swap for Dockerfile.cuda and add the gpu block below
    ports: ["8000:8000"]
    environment:
      PEEWEE_MODELS: english,multilingual
      PEEWEE_MAX_BATCH: "32"
      PEEWEE_MAX_WAIT_MS: "5"
      PEEWEE_WORKERS: "1"
      # PEEWEE_API_KEY: change-me
      # PEEWEE_CALIBRATION: /calibration/english.json
      # PEEWEE_BACKEND: onnx
      # PEEWEE_MODELS: english=/models/english-onnx,multilingual=/models/multilingual-onnx
    volumes:
      - peewee-hub:/root/.cache/huggingface
      # - ./calibration:/calibration:ro
      # - ./models:/models:ro
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
volumes:
  peewee-hub:
